<div class="row justify-content-center">
  <div class="col-md-6">
    <h3 class="mb-3">Login</h3>

    <form #f="ngForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input name="email" [(ngModel)]="form.email" required email class="form-control" />
        <div class="text-danger small mt-1" *ngIf="f.submitted && !form.email">Email is required.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input name="password" [(ngModel)]="form.password" required type="password" class="form-control" />
        <div class="text-danger small mt-1" *ngIf="f.submitted && !form.password">Password is required.</div>
      </div>

      <div class="text-danger mb-2" *ngIf="errorMsg">{{ errorMsg }}</div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" [disabled]="submitting">Login</button>
        <a class="btn btn-outline-secondary" routerLink="/register">Create an account</a>
      </div>
    </form>
  </div>
</div>
