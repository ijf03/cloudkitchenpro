<div *ngIf="loading" class="text-muted">Loading…</div>
<div *ngIf="errorMsg" class="text-danger">{{ errorMsg }}</div>

<div *ngIf="form && !loading">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h1 class="h3 m-0">Edit Item</h1>
    <a class="btn btn-outline-secondary" routerLink="/inventory">Back to list</a>
  </div>

  <form #f="ngForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Ingredient Name</label>
        <input name="ingredientName" [(ngModel)]="form.ingredientName" required class="form-control">
      </div>

      <div class="col-md-3">
        <label class="form-label">Quantity</label>
        <input name="quantity" [(ngModel)]="form.quantity" required type="number" class="form-control">
      </div>

      <div class="col-md-3">
        <label class="form-label">Unit</label>
        <select name="unit" [(ngModel)]="form.unit" required class="form-select">
          <option>kg</option><option>g</option><option>l</option><option>ml</option><option>pcs</option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Category</label>
        <select name="category" [(ngModel)]="form.category" required class="form-select">
          <option>Dairy</option><option>Produce</option><option>Meat</option><option>Pantry</option><option>Beverage</option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Purchase Date</label>
        <input name="purchaseDate" [(ngModel)]="form.purchaseDate" required type="date" class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Expiration Date</label>
        <input name="expirationDate" [(ngModel)]="form.expirationDate" required type="date" class="form-control">
      </div>

      <div class="col-md-6">
        <label class="form-label">Location</label>
        <select name="location" [(ngModel)]="form.location" required class="form-select">
          <option>Pantry</option><option>Fridge</option><option>Freezer</option><option>Storage</option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Cost</label>
        <input name="cost" [(ngModel)]="form.cost" required type="number" step="0.01" class="form-control">
      </div>
    </div>

    <div class="text-danger mt-3" *ngIf="errorMsg">{{ errorMsg }}</div>

    <div class="mt-3">
      <button class="btn btn-primary" [disabled]="submitting || !f.form.valid">Save</button>
      <a class="btn btn-outline-secondary ms-2" routerLink="/inventory">Cancel</a>
    </div>
  </form>
</div>
