<div class="d-flex align-items-center justify-content-between mb-3">
  <h1 class="h3 m-0">Add New Item</h1>
  <a class="btn btn-outline-secondary" routerLink="/inventory">Back to list</a>
</div>

<form #f="ngForm" (ngSubmit)="save(f)" novalidate>
  <div class="row g-3">

    <div class="col-md-12">
      <label class="form-label">Ingredient Name</label>
      <input name="ingredientName"
             [(ngModel)]="model.ingredientName"
             required minlength="2" maxlength="50"
             class="form-control">
    </div>

    <div class="col-md-4">
      <label class="form-label">Quantity</label>
      <input name="quantity"
             [(ngModel)]="model.quantity"
             required type="number" step="0.01" min="0.01"
             class="form-control">
    </div>

    <div class="col-md-4">
      <label class="form-label">Unit</label>
      <select name="unit"
              [(ngModel)]="model.unit"
              required class="form-select">
        <option value="">=== Unit ===</option>
        <option *ngFor="let u of unitOpts" [value]="u">{{ u }}</option>
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label">Category</label>
      <select name="category"
              [(ngModel)]="model.category"
              required class="form-select">
        <option value="">=== Category ===</option>
        <option *ngFor="let c of catOpts" [value]="c">{{ c }}</option>
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label">Purchase Date</label>
      <input type="date"
             name="purchaseDate"
             [(ngModel)]="model.purchaseDate"
             required class="form-control">
    </div>

    <div class="col-md-4">
      <label class="form-label">Expiration Date</label>
      <input type="date"
             name="expirationDate"
             [(ngModel)]="model.expirationDate"
             required class="form-control">
    </div>

    <div class="col-md-4">
      <label class="form-label">Location</label>
      <select name="location"
              [(ngModel)]="model.location"
              required class="form-select">
        <option value="">=== Location ===</option>
        <option *ngFor="let l of locOpts" [value]="l">{{ l }}</option>
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label">Cost</label>
      <input name="cost"
             [(ngModel)]="model.cost"
             required type="number" step="0.01" min="0.01"
             class="form-control">
    </div>

  </div>

  <div class="text-danger mt-3" *ngIf="error">{{ error }}</div>

  <div class="mt-3">
    <button class="btn btn-primary" [disabled]="f.invalid">Save Item</button>
    <a class="btn btn-outline-secondary ms-2" routerLink="/inventory">Cancel</a>
  </div>
</form>
